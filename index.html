<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panadería Rico Pan</title>

    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <!-- Título principal -->
    <h1>BIENVENIDOS PANADERIA RICO PAN</h1>

   <img src="imagen1-1.jpg" alt="Descripción de la imagen" width="200">


    <!-- Formulario de inicio de sesión -->
    <div class="login-container">

       

        <!-- Campo correo -->
        <div class="campo">
            <input 
                type="email" 
                id="correo" 
                placeholder="Correo"
            >
        </div>

        <!-- Campo contraseña -->
        <div class="campo">
            <input 
                type="password" 
                id="contrasena" 
                placeholder="Contraseña"
            >
        </div>

        <!-- Botón iniciar sesión -->
        <button class="btn-iniciar">
            Iniciar sesión
        </button>

        <!-- Botón recuperar contraseña -->
        <button class="btn-recuperar">
            Recuperar contraseña
        </button>

    </div>

</body>
</html>
